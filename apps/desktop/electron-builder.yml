appId: com.ghostbytestudios.eightbitagents
productName: 8Bit Agents
copyright: Copyright © 2026 Ghostbyte Studios
directories:
  output: release
# Everything is bundled into dist/, so no node_modules ship with the app.
files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  target: nsis
  # Fixed names, so the website can link to releases/latest/download/<name>.
  artifactName: 8Bit-Agents-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: universal
    # Auto-update on macOS installs from the zip, not the dmg.
    - target: zip
      arch: universal
  category: public.app-category.developer-tools
  # Ad-hoc signed until there is an Apple Developer ID: Apple Silicon refuses to run unsigned apps.
  # With a Developer ID, set identity to it, turn hardenedRuntime back on and add notarization.
  identity: "-"
  hardenedRuntime: false
  artifactName: 8Bit-Agents-mac.${ext}
linux:
  target:
    - target: AppImage
      arch: x64
  category: Development
  artifactName: 8Bit-Agents-linux.${ext}
publish:
  provider: github
  owner: ghostbytestudios
  repo: 8-bit-agents
  releaseType: draft
