# Builds the landing page (with the demo office inside) and publishes it to GitHub Pages.
# One-time setup: repo Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/client/**
      - packages/protocol/**
      - package-lock.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run apps/site apps/client
      - run: npm run build -w @harness/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
