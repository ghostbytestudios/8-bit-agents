# Pushing a tag like v0.2.0 builds the installers on Windows, macOS and Linux and uploads them
# to a draft GitHub release. Check the draft, then press Publish: the website's download buttons
# and the apps' auto-update only see published releases.
#
# The tag must match "version" in apps/desktop/package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version"
            exit 1
          fi
      # One draft up front, so the three builds upload into it instead of racing to create it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "8Bit Agents $GITHUB_REF_NAME" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build -w @harness/desktop
      - name: Build and upload the installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          # No paid certificates yet: Windows builds are unsigned, macOS builds are ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish always
